# Local development only. Do not deploy these credentials or ports to production.
services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zentro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-zentro}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  redis:
    image: redis:8.10.2-alpine3.23
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_only}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-redis_dev_only}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
volumes:
  postgres_data:
  redis_data:
