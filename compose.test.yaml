# Disposable test database; never uses development credentials or volumes.
services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: zentro_test
      POSTGRES_PASSWORD: test_only
      POSTGRES_DB: zentro_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zentro_test", "-d", "zentro_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
